name: 1ESBinskimCompliance
trigger:
  branches:
   include:
    - main

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: self
    type: git
    ref: refs/heads/main

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    customBuildTags:
    - 1ES.PT.ViaStartRight
    sdl:
      severity: Error
      sourceAnalysisPool: pool-1espt-mseng
      codeql:
        compiled:
          enabled: true
    pool:
      name: pool-1espt-mseng
      image: pool-1espt-mseng-image
      os: windows

    stages:
    - stage: release
      jobs:
      - job: Compliance
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/bld/bin
            artifactName: binskim-build-output
        steps:
        - task: UseDotNet@2
          displayName: 'Use .NET Core sdk 9'
          inputs:
              version: 9.x
        - task: BatchScript@1
          displayName: 'Run script BuildAndTest.cmd' 
          inputs:
            filename: BuildAndTest.cmd
